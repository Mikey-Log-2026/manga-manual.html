<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiKey Log - スマホ全画面体験</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, "Hiragino Sans", sans-serif; 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; flex-direction: column;
            /* dynamic vh を使うことで、スマホのブラウザバーを考慮した正確な全画面にします */
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
        }
        
        h1 { 
            font-size: 1.2rem; color: #0056b3; width: 100%; text-align: center; 
            padding: 10px 0; background: white; margin: 0; flex-shrink: 0;
        }

        .manga-viewport {
            flex-grow: 1; 
            /* 縮小も許可して、ボタンのスペースを奪わないようにします */
            flex-shrink: 1; 
            width: 100%; position: relative;
            background: #fff; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #mangaImage {
            width: 100%; height: auto; position: absolute;
            top: 0; left: 0;
            transition: transform 1.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(1.0);
            transform-origin: center center;
        }

        .flash { background-color: #fff !important; animation: flash-anim 0.3s; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0.5; } }
        .shake { animation: shake-anim 0.1s infinite; }
        @keyframes shake-anim {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            100% { transform: translate(3px, 3px); }
        }

        .ui-container {
            background: #222; padding: 15px; border-top: 3px solid #ff9800;
            display: flex; flex-direction: column; align-items: center;
            /* 絶対に潰れないように固定（最優先確保） */
            flex-shrink: 0; 
            /* スマホの画面最下部のセーフエリア（ノッチなど）に対応 */
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
        }

        #narrationBox { 
            font-size: 1.0em; font-weight: bold; color: #fff; 
            background: rgba(255,255,255,0.1); padding: 12px; 
            border-left: 6px solid #ff9800; margin-bottom: 12px;
            width: 90%; min-height: 3.0em; border-radius: 4px;
            opacity: 0; transition: 0.3s;
        }

        .play-button { 
            background: linear-gradient(45deg, #ff9800, #ff5722); 
            color: white; border: none; width: 95%; max-width: 400px;
            padding: 15px 0; font-size: 1.3em; font-weight: bold; 
            border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px #bf360c; transition: 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .play-button:active { transform: translateY(2px); box-shadow: none; }

        #mangaStatus { font-size: 0.9em; color: #ff9800; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>MiKey Log - 衝撃の4コマ解説</h1>

    <div class="manga-viewport" id="viewport">
        <img src="manga_4.png" id="mangaImage" alt="4コマ漫画">
    </div>

    <div class="ui-container">
        <div id="narrationBox">
            <div id="mangaStatus"></div>
            <div id="speechText">画面下のボタンを押してスタート！</div>
        </div>
        <button class="play-button" onclick="playDXExperience()">🔥 衝撃の再生スタート！</button>
    </div>

    <script>
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSE(type) {
            initAudio();
            const now = audioCtx.currentTime;
            const vp = document.getElementById('viewport');

            if (type === 'pipin') {
                vp.classList.add('flash');
                setTimeout(() => vp.classList.remove('flash'), 300);
                [1000, 1500, 2000].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(freq, now + (i * 0.05));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.05) + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.05)); osc.stop(now + (i * 0.05) + 0.2);
                });
            } else if (type === 'jajaan') {
                vp.classList.add('shake');
                setTimeout(() => vp.classList.remove('shake'), 1000);
                [130, 196, 261, 392].forEach((freq) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 1.2);
                });
            }
        }

        const mangaScripts = [
            { label: "1コマ目", text: "あぁ、また鍵借りるのに受付するのかぁ。面倒だなぁ……。", origin: "0% 0%", scale: 2.1 },
            { label: "2コマ目", text: "行列出来ているわぁ。次の現場に間に合わないヨォ！", origin: "100% 0%", scale: 2.1 },
            { label: "3コマ目", text: "そんな時はこれだ！ヘルメットの二次元コードをかざすだけ！", origin: "100% 100%", scale: 2.1, se: "pipin" },
            { label: "4コマ目", text: "管理の手場ゼロで、安心100パーセント！", origin: "0% 100%", scale: 2.1, se: "jajaan" }
        ];

        async function playDXExperience() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const img = document.getElementById('mangaImage');
            const box = document.getElementById('narrationBox');
            const status = document.getElementById('mangaStatus');
            const textEl = document.getElementById('speechText');
            
            box.style.opacity = '1';

            for (let i = 0; i < mangaScripts.length; i++) {
                const script = mangaScripts[i];
                img.style.transformOrigin = script.origin;
                img.style.transform = `scale(${script.scale})`;
                status.innerText = script.label;
                textEl.innerText = script.text;

                if (script.se) setTimeout(() => playSE(script.se), 400);

                await speak(script.text);
                await new Promise(r => setTimeout(r, 1500));
            }

            img.style.transform = "scale(1.0)";
            img.style.transformOrigin = "center center";
            status.innerText = "COMPLETE";
            textEl.innerText = "MiKey Logで現場を劇的に変える！";
        }

        function speak(text) {
            return new Promise((resolve) => {
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = "ja-JP";
                uttr.rate = 1.0;
                uttr.onend = () => resolve();
                window.speechSynthesis.speak(uttr);
            });
        }
    </script>
</body>
</html>
